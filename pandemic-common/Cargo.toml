[package]
name = "pandemic-common"
version = "0.5.0"
edition = "2021"

[dependencies]
pandemic-protocol = { path = "../pandemic-protocol" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha256 = "1.5"
# RFC3339 timestamps for audit log entries (same convention as state records)
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Nonce / secret generation (shared by the agent, the node receiver, and the
# coordinator) and the constant-time compare behind agent auth.
rand = "0.8"
subtle = "2.6"
# Epidemic discovery (increment 2): mDNS advertise (node) + probe (coordinator).
agnostic-mdns = { workspace = true }
# Epidemic broadcast (increment 3): raw UDP multicast socket (SO_REUSEADDR
# join) for spread intents.
socket2 = "0.5"
# agnostic-mdns -> agnostic-net enables rustix with only the `net` feature, but
# rustix >= 1.1.5 compiles `net/sockopt.rs` against `crate::timespec`, which
# needs the `time` feature (upstream feature-gating bug). Enabling `time` here
# fixes the build for the whole dependency graph.
#
# `fs` is enabled so the shared spread rate limiter (increment 4c) can take an
# advisory `flock` on its state file — pure Rust, already in the lockfile, no
# new heavy dependency.
rustix = { version = "1", features = ["time", "fs"] }
# Bundle extraction for registry spec/deployment atoms (pure-Rust, musl-safe).
tar = "0.4"
flate2 = "1.0"
tempfile = "3.0"
# Epidemic increment 4 (hardening): TLS on the coordinator -> node hop. rustls
# (ring provider) + PEM parsing for cert/key material, and tokio-rustls for the
# async TLS streams. All three are already in the lockfile (pandemic-iam /
# reqwest), so this introduces no new heavy dependency.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2.0"
tokio-rustls = "0.26"

[dev-dependencies]
tokio-test = "0.4"