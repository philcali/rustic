[package]
name = "pandemic-common"
version = "0.5.0"
edition = "2021"

[dependencies]
pandemic-protocol = { path = "../pandemic-protocol" }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha256 = "1.5"
# RFC3339 timestamps for audit log entries (same convention as state records)
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Bundle extraction for registry spec/deployment atoms (pure-Rust, musl-safe).
tar = "0.4"
flate2 = "1.0"
tempfile = "3.0"

[dev-dependencies]
tokio-test = "0.4"