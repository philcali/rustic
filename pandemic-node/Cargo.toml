[package]
name = "pandemic-node"
version = "0.5.0"
edition = "2021"

[[bin]]
name = "pandemic-node"
path = "src/main.rs"

[dependencies]
pandemic-protocol = { path = "../pandemic-protocol" }
pandemic-common = { path = "../pandemic-common" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = "0.2"
# Epidemic increment 4 (hardening): wrap the accepted TCP connection in TLS
# before the shared handshake (see pandemic-common::tls for the cert config).
tokio-rustls = "0.26"

[dev-dependencies]
tempfile = "3.0"
