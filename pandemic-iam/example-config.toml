# Example pandemic-iam configuration
# This demonstrates how to configure IAM Anywhere integration
# WARNING: This is a template. You MUST replace all <placeholders> before use.

[server]
host = "127.0.0.1"
port = 8080

[aws]
# IAM Anywhere configuration
certificate_path = "/etc/pandemic/certs/client.crt"
private_key_path = "/etc/pandemic/certs/client.key"
trust_anchor_arn = "arn:aws:rolesanywhere:us-east-1:<account_id>:trust-anchor/<trust_anchor_id>"
profile_arn = "arn:aws:rolesanywhere:us-east-1:<account_id>:profile/pandemic-profile"
role_arn = "arn:aws:iam::<account_id>:role/PandemicRole"

# Role mappings for different services
[role_mappings]
"pandemic-daemon" = "arn:aws:iam::<account_id>:role/PandemicDaemonRole"
"pandemic-rest" = "arn:aws:iam::<account_id>:role/PandemicRestRole"
"default" = "arn:aws:iam::<account_id>:role/PandemicDefaultRole"