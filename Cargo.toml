[workspace]
members = [
    "pandemic-daemon",
    "pandemic-cli", 
    "pandemic-protocol",
    "pandemic-common",
    "examples/hello-infection",
    "pandemic-udp",
    "pandemic-rest",
    "pandemic-console",
    "pandemic-iam",
    "pandemic-proxy",
    "pandemic-agent",
    "pandemic-mqtt",
    "pandemic-node"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
# mDNS (RFC 6762/6335) advertise + discover for epidemic discovery
# (increment 2). `tokio` feature = async server/client on our runtime.
agnostic-mdns = { version = "0.4", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"